# basalt-ledger configuration (docs/ledger.md). Defaults shown.

# The chain and its sealed files (keep it outside the root snapshot).
#dir = /var/log/basalt-ledger
#socket = /run/basalt-ledger/ledger.sock

# Seal the current file when it reaches this size (MiB) or age.
#rotate_size = 8
#rotate_age = 24h

# Collectors: the journal (SELinux denials, logins, polkit, pkexec, sudo,
# the system assistant) and snapper's snapshot directory.
#journal = yes
#snapshots = /.snapshots

# Producer names unprivileged users may write as (their own uid only).
#user_producers = basalt-agent basalt-shell

# Export signing key: auto (the TPM-held key when a TPM 2.0 is usable,
# else a software key on disk), tpm (only the TPM key; without a TPM,
# exports are refused) or software. The public key is in
# /var/log/basalt-ledger/keys/export.pub.
#export_key = auto
#tpm_device = /dev/tpmrm0

# How long sealed files are kept: a number of days (365d), a duration, or
# forever. Each removal is recorded in the chain first, so verify still
# passes after it.
#retention = 365d
