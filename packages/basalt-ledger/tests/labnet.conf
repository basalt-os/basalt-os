# Lab-only profile (never shipped): a plain bash for the egress and ledger
# tests. Loopback is off so every connection goes through the session sets.
# The two lab names resolve (lab DNS server, routed by the stub resolver) to
# the VM's own address, where a test HTTP server listens on 8008.

[agent]
name = labnet
description = Lab test shell (egress and ledger tests)
command = bash

[install]
method = none

[egress]
include = registries
allow = model.basalt-lab.test:8008 private
allow = rebind.basalt-lab.test:8008
loopback = no
