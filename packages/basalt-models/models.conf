# Basalt OS model downloads from the desktop (basalt-models).
#
# When push to talk has no speech model yet, or a skill needs the
# assistant's local model, the desktop asks the person and, if they choose
# Download, fetches the model from the pinned URL of its manifest and
# checks its SHA-256 (basalt-voice-fetch, basalt-llm-fetch), in a confined
# system service. Settings, Voice and assistant, downloads and removes
# models the same way. Every download is recorded in the audit ledger with
# who consented.
#
# Who may download and remove models from the desktop:
#   everyone        any person in an active local session (the default)
#   administrators  members of admin_group; anyone else is asked for an
#                   administrator's password
#   nobody          the desktop never downloads; administrators use
#                   basalt-voice-fetch and basalt-llm-fetch
downloads = everyone

# The group whose members count as administrators.
admin_group = wheel
