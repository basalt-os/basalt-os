# basalt-agent profile the AI audit suite's probes run in (the attacker).
# Copied into the basalt-audit account for each run, never shipped as a
# profile for people. It carries no secret of its own (docs/reproduce.md).

[agent]
name = audit
description = AI audit suite probes (Security and Activity, Run audit)
command = bash

[install]
method = none
packages = bash coreutils git python3 curl procps-ng findutils

[egress]
include = registries
