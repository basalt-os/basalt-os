# nfpm configuration of the "cotty-guard" .deb. Built by
# packages/cotty/build-deb.sh (same variables as cotty.yaml).
name: cotty-guard
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: "1"
section: admin
priority: optional
maintainer: Basalt OS project <noreply@basalt-os.org>
vendor: OpenBasalt
homepage: https://github.com/openbasalt/cotty
license: Apache-2.0
description: |-
  kernel enforcement of cotty's agent rules (BPF LSM)
  cotty-guard is an optional root service that loads BPF LSM programs
  which enforce cotty's agent rules in the kernel, for every process of an
  agent, and protect a cotty session's terminal from every other process.
  It needs the bpf LSM active (bpf in /sys/kernel/security/lsm) and kernel
  BTF. Ubuntu leaves bpf out of the default LSM list: add it on the kernel
  command line (see /usr/share/doc/cotty-guard/guard.md, Distributions).
  .
  The service is not enabled at installation: systemctl enable --now
  cotty-guard. Removing the package stops it and runs cotty-guard
  uninstall, which detaches the programs and removes their maps.
depends:
  - cotty (= ${PKG_VERSION}-1)

scripts:
  postinstall: cotty-guard.postinst
  preremove: cotty-guard.prerm
  postremove: cotty-guard.postrm

contents:
  - src: ${BUILD}/bin/cotty-guard
    dst: /usr/bin/cotty-guard
    expand: true
    file_info: {mode: 0755}
  - src: ${SRC}/dist/systemd/cotty-guard.service
    dst: /usr/lib/systemd/system/cotty-guard.service
    expand: true
    file_info: {mode: 0644}
  - src: cotty-guard.lintian-overrides
    dst: /usr/share/lintian/overrides/cotty-guard
    file_info: {mode: 0644}
  - src: copyright
    dst: /usr/share/doc/cotty-guard/copyright
    expand: true
    file_info: {mode: 0644}
  - src: ${BUILD}/doc/changelog.Debian.gz
    dst: /usr/share/doc/cotty-guard/changelog.Debian.gz
    expand: true
    file_info: {mode: 0644}
  - src: ${SRC}/docs/guard.md
    dst: /usr/share/doc/cotty-guard/guard.md
    expand: true
    file_info: {mode: 0644}
