# cotty, a terminal shared by a person and an AI coding agent, is developed
# in its own repository; basalt-testing (RPM) and the apt testing suite
# package it from this commit. Bump the commit (a commit of main) to ship a
# new version.
#
# The repository is not public yet: the build host fetches it with its own
# git credentials (for example a credential helper set up by
# `gh auth setup-git`), never with a token written here, or COTTY_SRC names
# a clone or a git bundle that holds the commit. Either way the fetched
# commit must be this one.
#
# cotty has no release yet, so the version is a pre-release snapshot of
# COTTY_VERSION_BASE: <base>~git<commit time, UTC>.<sha12>, which sorts
# before <base> in rpm and in dpkg.
COTTY_REPO_URL=https://github.com/openbasalt/cotty.git
COTTY_COMMIT=de1f5c2da80127f367bd605ebc2dacca0fd7eeb2
COTTY_VERSION_BASE=0.1.0
