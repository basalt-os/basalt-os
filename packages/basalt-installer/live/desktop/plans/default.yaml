# Basalt OS desktop edition, the starting plan of the live desktop's
# installer. The disk is the installer's suggestion; nothing is written
# before the person reviews the steps and types the disk name.
apiVersion: basalt-install-plan/v1
edition: desktop
layout:
  mode: automatic
encryption:
  enabled: true
  unlock: tpm2
profile: auto
hostname: basalt
repos:
  basalt:
    url: media
  # The desktop shell is pre-release: basalt-testing at install time (from
  # the media) and on the installed system.
  testing: true
# The desktop package set (the session, voice, the consented model
# downloads, the local model service) comes with edition: desktop; list
# more packages under packages.extra.
finish: reboot
