# Desktop live image (LIVE_PROFILE=desktop in build-live.sh): the
# installer image plus the Basalt desktop edition, booting into the Basalt
# session on SwayFX with a live user; the graphical installer is an app
# of the session ("Install Basalt OS").

[Content]
Hostname=basalt-live
Packages=
        basalt-desktop
        basalt-shell-selinux
        basalt-agent-selinux
        basalt-assistant
        basalt-assistant-selinux
        basalt-backgrounds
        basalt-prompt
        sudo
        glibc-langpack-en
        glibc-langpack-pt
