# Basalt OS live desktop: the live user starts the Basalt session on the
# first boot (initial_session); logging out returns to the login screen
# (basalt-greeter, or the text login when it cannot run), where the live
# user's password is "basalt".
[terminal]
vt = 1

[default_session]
command = "/usr/libexec/basalt-greeter/greeter-session"
user = "greetd"

[initial_session]
command = "basalt-session sway"
user = "basalt"
