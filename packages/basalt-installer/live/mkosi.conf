# Basalt OS live installer image (mkosi). Built by build-live.sh, which
# also provides the sandbox tree with the repositories (Fedora and the signed
# Basalt repository) and turns the resulting tree into the ISO: an EROFS
# image labeled for SELinux (mkfs.erofs --file-contexts), copied to memory
# by dracut's dmsquash-live (rd.live.ram) under a tmpfs overlay, booted by
# Fedora's signed shim, GRUB and kernel. Secure Boot on, SELinux enforcing.

[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64

[Output]
Format=directory
Output=basalt-live
ManifestFormat=json

[Build]
ToolsTree=

[Content]
Bootable=no
WithDocs=no
Locale=C.UTF-8
Keymap=us
Timezone=UTC
Hostname=basalt-installer
# Labels come from mkfs.erofs --file-contexts (build-live.sh), not from
# extended attributes on the build host, which may not know the policy.
SELinuxRelabel=no
Packages=
        basalt-release
        basalt-logos
        basalt-installer
        basalt-installer-gui
        systemd
        systemd-udev
        systemd-resolved
        systemd-pam
        kernel-core
        kernel-modules
        dracut
        dracut-live
        selinux-policy-targeted
        shim-x64
        grub2-efi-x64
        NetworkManager
        dnf5
        rpm
        fedora-repos
        util-linux
        gdisk
        dosfstools
        e2fsprogs
        btrfs-progs
        cryptsetup
        tpm2-tss
        tpm2-tools
        clevis
        clevis-luks
        efibootmgr
        mokutil
        kbd
        less
        vim-minimal
        iproute
        iputils
        procps-ng
        pciutils
        usbutils
        openssh-clients
        passwd
        shadow-utils
        cage
        quickshell
        qt6-qtsvg
        qt6-qtwayland
        xkeyboard-config
        rsms-inter-fonts
        jetbrains-mono-fonts
        google-noto-sans-fonts
RemovePackages=
        fedora-release
        fedora-release-common
        fedora-logos
RemoveFiles=
        /usr/share/man
        /usr/share/info
        /usr/lib/firmware/amdgpu
        /usr/lib/firmware/nvidia
        /var/cache/libdnf5
