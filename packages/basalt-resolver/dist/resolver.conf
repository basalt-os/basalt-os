# basalt-resolver configuration (docs/network.md). Defaults shown.

# Where allowed names are resolved: the system stub resolver.
#upstream = 127.0.0.53:53

# Loopback ports of the per-session resolvers (SELinux type
# basalt_resolver_port_t covers 47200-47263).
#ports = 47200-47263

# nflog group of the session drop rules.
#log_group = 47

# How long an address handed out for an allowed name stays reachable:
# the record's TTL clamped to [min_ttl, max_ttl], plus grace.
#min_ttl = 1m
#max_ttl = 1h
#grace = 5m

# basalt-ledger socket for the decision records.
#ledger = /run/basalt-ledger/ledger.sock
