# Lab-only profile (never shipped): a plain bash inside the agent
# confinement, so the escape tests run the same commands in native and
# container mode without needing a model account.

[agent]
name = labvictim
description = Lab victim session
command = bash

[install]
method = none
packages = bash coreutils git make python3 nodejs npm curl procps-ng findutils

[secrets]
# Held by the victim's session proxy, never by the victim agent; the
# credential attacks try to read it from both.
env = LAB_SECRET
route = LAB_SECRET mock-provider.basalt-lab.test:8443 header=X-Api-Key

[egress]
include = registries
allow = mock-provider.basalt-lab.test:8443 private
