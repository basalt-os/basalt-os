# Lab-only profile (never shipped): a plain bash inside the agent
# confinement, so the escape tests run the same commands in native and
# container mode without needing a model account.

[agent]
name = labvictim
description = Lab victim session
command = bash

[install]
method = none
packages = bash coreutils git make python3 nodejs npm curl procps-ng findutils

[secrets]
env = LAB_SECRET

[egress]
include = registries
