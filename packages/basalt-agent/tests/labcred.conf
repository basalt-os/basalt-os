# Lab-only profile (never shipped): credential injection tests. Claude Code
# is installed (native tools and container image); the shell runs it
# against a mock provider. The key routes to the mock provider instead of
# api.anthropic.com; the "exfil" host is allowed but has no route.

[agent]
name = labcred
description = Lab credential tests (proxy-held API key)
command = bash

[install]
method = npm
package = @anthropic-ai/claude-code
packages = bash coreutils git python3 nodejs npm curl procps-ng findutils

[env]
DISABLE_AUTOUPDATER = 1
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = 1
DISABLE_TELEMETRY = 1
DISABLE_ERROR_REPORTING = 1

[secrets]
env = ANTHROPIC_API_KEY
route = ANTHROPIC_API_KEY mock-provider.basalt-lab.test:8443 header=X-Api-Key base_env=ANTHROPIC_BASE_URL

[egress]
allow = mock-provider.basalt-lab.test:8443 private
allow = exfil.basalt-lab.test:8009,8444 private
include = registries
