# Aider under basalt-agent. It talks to whichever model provider is
# configured; the allowlist covers the common ones, trim it to yours.

[agent]
name = aider
description = Aider, pair programming in the terminal with any model provider
command = aider

[install]
method = pip
package = aider-chat
packages = python3 python3-pip git

[env]
AIDER_ANALYTICS = false
AIDER_CHECK_UPDATE = false
AIDER_SHOW_RELEASE_NOTES = false

[secrets]
env = OPENAI_API_KEY
env = ANTHROPIC_API_KEY
env = GEMINI_API_KEY
env = OPENROUTER_API_KEY

[egress]
allow = api.openai.com
allow = api.anthropic.com
allow = generativelanguage.googleapis.com
allow = openrouter.ai
# Model metadata (context sizes, prices) fetched at start.
allow = raw.githubusercontent.com
include = registries
