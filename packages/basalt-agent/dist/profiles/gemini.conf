# Gemini CLI (Google) under basalt-agent.
# API key: GEMINI_API_KEY in ~/.config/basalt-agent/secrets/gemini.env.

[agent]
name = gemini
description = Gemini CLI, Google's coding agent
command = gemini

[install]
method = npm
package = @google/gemini-cli
packages = nodejs npm git ripgrep

[env]
GEMINI_CLI_DISABLE_AUTO_UPDATE = true

[secrets]
env = GEMINI_API_KEY
env = GOOGLE_API_KEY

[egress]
allow = generativelanguage.googleapis.com
# Login with a Google account (Code Assist).
allow = cloudcode-pa.googleapis.com
allow = oauth2.googleapis.com
allow = accounts.google.com
allow = www.googleapis.com
include = registries
