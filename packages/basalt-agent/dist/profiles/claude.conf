# Claude Code (Anthropic) under basalt-agent.
# API key: ANTHROPIC_API_KEY in ~/.config/basalt-agent/secrets/claude.env, or
# log in inside a session (the login stays in this profile's own home).

[agent]
name = claude
description = Claude Code, Anthropic's coding agent CLI
command = claude

[install]
method = npm
package = @anthropic-ai/claude-code
packages = nodejs npm git ripgrep

[env]
# No auto-updates (the tool layer is read-only) and no telemetry or error
# reporting hosts outside the allowlist.
DISABLE_AUTOUPDATER = 1
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = 1

[secrets]
env = ANTHROPIC_API_KEY

[egress]
allow = api.anthropic.com
# Interactive login (claude.ai subscription or Console account).
allow = claude.ai
allow = console.anthropic.com
allow = platform.claude.com
include = registries
