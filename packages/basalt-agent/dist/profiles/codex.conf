# Codex CLI (OpenAI) under basalt-agent.
# API key: OPENAI_API_KEY in ~/.config/basalt-agent/secrets/codex.env (kept
# in the session proxy; Codex sees a placeholder). Current Codex releases
# ignore OPENAI_BASE_URL for the built-in OpenAI provider, so with a key
# give Codex a provider through the proxy, in
# ~/.local/share/basalt-agent/home/codex/.codex/config.toml:
#   model_provider = "basalt"
#   [model_providers.basalt]
#   name = "OpenAI through the basalt-agent session proxy"
#   base_url = "http://api.openai.com/v1"
#   env_key = "OPENAI_API_KEY"
#   wire_api = "responses"
# (without it Codex sends the placeholder and the API refuses it). Or
# log in inside a session (stored in this profile's own home, ~/.codex).

[agent]
name = codex
description = Codex CLI, OpenAI's coding agent
command = codex

[install]
method = npm
package = @openai/codex
packages = nodejs npm git ripgrep

[secrets]
env = OPENAI_API_KEY

[egress]
allow = api.openai.com
# Interactive login with a ChatGPT account.
allow = auth.openai.com
allow = chatgpt.com
include = registries
