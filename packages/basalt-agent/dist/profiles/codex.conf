# Codex CLI (OpenAI) under basalt-agent.
# API key: OPENAI_API_KEY in ~/.config/basalt-agent/secrets/codex.env, or
# log in inside a session (stored in this profile's own home, ~/.codex).

[agent]
name = codex
description = Codex CLI, OpenAI's coding agent
command = codex

[install]
method = npm
package = @openai/codex
packages = nodejs npm git ripgrep

[secrets]
env = OPENAI_API_KEY

[egress]
allow = api.openai.com
# Interactive login with a ChatGPT account.
allow = auth.openai.com
allow = chatgpt.com
include = registries
