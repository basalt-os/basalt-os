# Basalt OS: plymouthd decodes the splash text with mbrtowc, which needs a
# UTF-8 locale. In the initramfs LANG comes from /etc/locale.conf (for
# example pt_BR.UTF-8) but that locale's data is not there, so
# setlocale(LC_ALL, "") fails, plymouthd stays in the C locale and every
# non-ASCII letter ("recuperação", "Não") is drawn as a missing glyph.
# C.UTF-8 is built into glibc: it needs no locale files. The theme picks
# the language itself (basalt, basalt-pt_BR); this only fixes the decoding.
[Service]
Environment=LC_ALL=C.UTF-8
