# Basalt OS: what plymouthd needs in the initramfs to draw non-ASCII
# letters (plymouth-theme-basalt). plymouthd calls setlocale only when it
# finds /usr/share/locale/nl/LC_MESSAGES/plymouth.mo (its test for "not in
# the initrd"), so that file comes along (910 bytes); then the drop-in of
# plymouth-start.service sets LC_ALL=C.UTF-8, whose locale data comes too
# (glibc-common, about 400 KiB: C.UTF-8 is not built into glibc). Without
# them plymouthd stays in the C locale and draws "ç" and "ã" as missing
# glyphs.
install_items+=" /usr/lib/systemd/system/plymouth-start.service.d/50-basalt-utf8.conf "
install_items+=" /usr/lib/locale/C.utf8/LC_ADDRESS /usr/lib/locale/C.utf8/LC_COLLATE /usr/lib/locale/C.utf8/LC_CTYPE "
install_items+=" /usr/lib/locale/C.utf8/LC_IDENTIFICATION /usr/lib/locale/C.utf8/LC_MEASUREMENT "
install_items+=" /usr/lib/locale/C.utf8/LC_MESSAGES/SYS_LC_MESSAGES /usr/lib/locale/C.utf8/LC_MONETARY "
install_items+=" /usr/lib/locale/C.utf8/LC_NAME /usr/lib/locale/C.utf8/LC_NUMERIC /usr/lib/locale/C.utf8/LC_PAPER "
install_items+=" /usr/lib/locale/C.utf8/LC_TELEPHONE /usr/lib/locale/C.utf8/LC_TIME "
install_items+=" /usr/share/locale/nl/LC_MESSAGES/plymouth.mo "
