# Basalt OS: graphical boot menu on the screen (basalt-grub2-theme).
#
# Template, installed as /usr/share/basalt/grub2/basalt-theme.cfg, for two
# users that put @THEME_DIR@ in: /etc/grub.d/06_basalt_theme when
# grub2-mkconfig writes /boot/grub2/grub.cfg of an installed system (it may
# also change the gfxmode and terminal lines, see there), and the live
# image build (packages/basalt-installer/live/build-live.sh) for the ISO.
#
# Only the screen changes. A theme applies to GRUB's gfxterm alone, so a
# serial terminal keeps the plain text menu, with every entry (the snapshot
# entries too). Without the theme files or a usable graphics mode nothing
# changes and the text menu stays on the screen as well. The theme files
# are data (images, fonts, a text file), not code: GRUB, shim and the
# kernel stay Fedora's signed binaries, and Secure Boot is not involved.
set basalt_theme_dir="@THEME_DIR@"
set basalt_gfx=n
if [ -f "${basalt_theme_dir}/theme.txt" ]; then
  insmod all_video
  insmod gfxterm
  insmod gfxmenu
  insmod png
  # Modes in order of preference; the first one the firmware offers wins. The
  # default list puts 1920x1080 and other common modes before the firmware's
  # own, so a HiDPI panel gets a mode where the text is readable.
  set gfxmode="1920x1080,1920x1200,1680x1050,1600x900,1440x900,1366x768,1280x800,1280x720,1024x768,auto"
  if terminal_output --append gfxterm; then terminal_output --remove console; set basalt_gfx=y; fi
  if [ "${basalt_gfx}" = y ]; then
    # With Secure Boot on, Fedora's signed GRUB reads fonts only from the
    # memdisk inside its own signed image (font files on disk are refused):
    # "unicode" there is Unifont 16. The theme draws all its text with it,
    # so the menu looks the same with Secure Boot on or off; the rest of the
    # theme (background, logo, key hints) is images, which GRUB may read.
    loadfont unicode
    set theme="${basalt_theme_dir}/theme.txt"
    export theme
  fi
fi
