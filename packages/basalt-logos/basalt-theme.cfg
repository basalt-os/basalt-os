# Basalt OS: graphical GRUB menu.
#
# Installed as /usr/share/basalt/grub2/basalt-theme.cfg; /etc/grub.d/06_basalt_theme
# copies it into /boot/grub2/grub.cfg when grub2-mkconfig runs. The theme files
# must be on the unencrypted /boot partition (GRUB cannot read the LUKS2 root):
# basalt-grub-theme-sync copies them from /usr/share/basalt/grub2/themes/basalt to
# /boot/grub2/themes/basalt (package scriptlet and basalt-grub-theme.service).
#
# Falls back to the plain text menu when the theme is missing or no graphics
# mode is available. A serial terminal set up by GRUB_TERMINAL_OUTPUT is kept.
set basalt_theme_dir="${prefix}/themes/basalt"
if [ -f "${basalt_theme_dir}/theme.txt" ]; then
  load_video
  insmod gfxterm
  insmod png
  set gfxmode=auto
  if terminal_output --append gfxterm; then
    terminal_output --remove console
    loadfont "${basalt_theme_dir}/inter-regular-14.pf2"
    loadfont "${basalt_theme_dir}/inter-regular-16.pf2"
    loadfont "${basalt_theme_dir}/inter-regular-20.pf2"
    loadfont "${basalt_theme_dir}/inter-medium-20.pf2"
    set theme="${basalt_theme_dir}/theme.txt"
    export theme
  fi
fi
