# Basalt OS local language model service (basalt-llm), read by systemd as
# an environment file. Restart the service after a change:
#   systemctl restart basalt-llm
#
# The model service is optional and off by default. To use it:
#   basalt-llm-fetch --list
#   basalt-llm-fetch auto          (the model MODEL=auto selects here)
#   systemctl enable --now basalt-llm
# and turn on what should use it in /etc/basalt/assistant.conf
# ([translator] enabled = yes, and/or [decision] backend = openai-compatible).

# Which model the service runs, chosen each time it starts (the log says
# which and why; a running service never switches):
#   auto        the fine-tuned translator that fits this machine: the 1.7B
#               with 4 or more CPU cores, 3584 MiB available memory and a
#               service memory limit of 3072 MiB or more, else the 0.6B
#   0.6b, 1.7b  that fine-tuned translator, whatever the machine
#   NAME        a model from /usr/share/basalt-llm/models.manifest
#   /path.gguf  another GGUF file you trust (no checksum is checked; it must
#               be readable by the service, e.g. in /var/lib/basalt-llm/models)
# The fine-tuned translators are not yet published (they need a signed
# release); until then use a published NAME, e.g. qwen3-1.7b-q8_0.
MODEL=auto

# CPU threads for generation and for reading the prompt. 0 = every CPU the
# service may use, at most 8 (the service runs at a low priority).
THREADS=0

# Context window in tokens. The assistant's prompts need about 1000.
CTX_SIZE=2048

# Memory in MiB for prompts kept for reuse (the translator's and the
# decision layer's fixed instructions). llama-server's own default is 8 GiB.
CACHE_RAM=256

# Extra llama-server options, for experts (e.g. "--cache-type-k q8_0").
EXTRA_ARGS=
