# Basalt OS shell prompt (basalt-prompt(1)). System defaults; a user's
# ~/.config/basalt/prompt.conf overrides any of these, and
# BASALT_PROMPT_<KEY> variables override both (BASALT_PROMPT_LINES=2).
# Changes apply to new shells.

# yes, or no to keep the distribution's plain prompt.
#enable = yes

# Symbols: auto (Unicode on UTF-8 terminals, ASCII on the Linux console,
# serial lines and other locales), unicode or ascii.
#glyphs = auto

# Colors: auto (truecolor when COLORTERM says so, else 256 or 16 colors by
# TERM; none when NO_COLOR is set or TERM=dumb), truecolor, 256, 16, none.
#color = auto

# Palette: auto (tones readable on dark and light backgrounds; COLORFGBG
# picks one when the terminal sets it), dark or light.
#theme = auto

# 1: everything on one line. 2: information above, the prompt sign below.
#lines = 1

# user@host: auto (over SSH, as root, in containers, and outside a local
# graphical session), always or never.
#host = auto

# Shorten the working directory to its last components beyond this many
# characters (0: never).
#path_max = 40

# Git branch, and the marks from one time-boxed `git status`
# (+ staged, * modified, ? untracked, ↑/↓ ahead/behind, ~ not checked).
# Repositories on network file systems get the branch only.
#git = yes
#git_dirty = yes
#git_untracked = no
#git_timeout_ms = 200

# Segments.
#show_status = yes
#show_jobs = yes
#show_agent = yes
#show_container = yes
