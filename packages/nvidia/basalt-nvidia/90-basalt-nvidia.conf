# NVIDIA driver (basalt-nonfree, package basalt-nvidia): neither nouveau nor
# the NVIDIA modules go into the initramfs. nouveau must not take the GPU
# before the system decides which driver this boot uses
# (basalt-nvidia-boot.service), and the NVIDIA modules are signed with a
# certificate the kernel learns only after the root file system is mounted
# (basalt-module-keys.service). The console stays on the firmware
# framebuffer until then.
omit_drivers+=" nouveau nvidia nvidia_drm nvidia_modeset nvidia_uvm nvidia_peermem "
