# NVIDIA driver (basalt-nonfree, package basalt-nvidia): nouveau stays off
# while the NVIDIA driver is installed. To use nouveau again, the fallback
# writes a file with this same name to /etc/modprobe.d (or, for one boot,
# /run/modprobe.d), which replaces this one: see basalt-nvidia status.
blacklist nouveau
options nouveau modeset=0

# Kernel mode setting and a framebuffer console on the NVIDIA GPU (needed
# by Wayland compositors); load the DRM module together with the driver.
options nvidia-drm modeset=1 fbdev=1
softdep nvidia post: nvidia-drm

# Keep video memory across suspend and hibernation (with the units of
# nvidia-driver-power). /var/tmp is on disk, not a size-limited tmpfs.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
