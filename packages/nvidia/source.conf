# NVIDIA driver for basalt-nonfree: one version, pinned by SHA-256.
# Shell syntax; read by scripts/release/build-nonfree.sh and the specs.
#
# The branch is NVIDIA's current production branch (R595). The open kernel
# modules, the userspace from the .run and the open tools must all carry the
# same version: the modules work only with their own userspace and GSP
# firmware. A new version changes every value below in one commit.
NVIDIA_VERSION=595.104.02
NVIDIA_BRANCH=595

# Official driver package (userspace, GSP firmware). NVIDIA publishes its
# checksum next to it (.run.sha256sum); this is the same value.
NVIDIA_RUN_URL=https://download.nvidia.com/XFree86/Linux-x86_64/595.104.02/NVIDIA-Linux-x86_64-595.104.02.run
NVIDIA_RUN_SHA256=e421c202e4c79f58c3c7f3161bbe71454ebb3d88936f88205a0e327cd04c59ca

# The NVIDIA Driver License Agreement in that .run (LICENSE). The build
# refuses a .run whose Agreement differs: a new text needs a new review,
# and basalt-assistant shows this exact text before an install.
NVIDIA_LICENSE_SHA256=c692fb14ad4f499c6aee1b9e144e6905148c420e6225b17cb2937366c1e507ad

# Open GPU kernel modules (MIT/GPLv2), the GitHub tag of the same version.
NVIDIA_OPEN_URL=https://github.com/NVIDIA/open-gpu-kernel-modules/archive/refs/tags/595.104.02.tar.gz
NVIDIA_OPEN_SHA256=11576ab27914d674e5e7917251b1d7bd838590149c800115075826ae70c5665d

# Open userspace tools built from their own sources.
NVIDIA_MODPROBE_URL=https://github.com/NVIDIA/nvidia-modprobe/archive/refs/tags/595.104.02.tar.gz
NVIDIA_MODPROBE_SHA256=576eb1d0e9ad823fb8423998cb60f9b36c7340c092a79f8ca7c530c129f23941
NVIDIA_PERSISTENCED_URL=https://github.com/NVIDIA/nvidia-persistenced/archive/refs/tags/595.104.02.tar.gz
NVIDIA_PERSISTENCED_SHA256=5bc93a66a643fd868028ed62e82869bcbd515232ce760df0de96b98acf5068db
