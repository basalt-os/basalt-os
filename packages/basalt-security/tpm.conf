# Basalt OS TPM2 disk unlock settings (shell syntax), read by basalt-tpm.

# PCRs the TPM2 key is sealed to. 7 = Secure Boot policy: enabled or not,
# PK, KEK, db, dbx, and which certificates verified the boot loaders.
# Kernel updates and snapshot rollbacks do not change it. See the Basalt OS
# documentation (docs/secure-boot.md) before adding others: PCR 4, 8 and 9
# change with every kernel, boot menu or initramfs update.
TPM_PCRS=7

# Encrypted volume to manage. Empty: the first entry of /etc/crypttab.
TPM_DEVICE=
