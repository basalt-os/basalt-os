# Basalt OS system assistant. Values shown are the defaults.
# Restart basalt-assistantd after a change.

[decision]
# rules: deterministic rules with fixed probabilities (default).
# openai-compatible: a language model behind an OpenAI-compatible endpoint,
# normally the local model service (package basalt-llm, socket below). It
# answers the cause and class questions (unit.cause, avc.class, dnf.next,
# disk.cause); severity, notification and routing stay with the rules, and
# the rules answer whenever the model is not reachable (marked "fallback").
backend = rules
#endpoint = unix:/run/basalt-llm/llm.sock
#model =
# A non-local endpoint (another machine) is refused unless this is yes.
#allow_remote = no
# Below this probability the assistant does not propose a change on its
# own; the finding is marked for review.
default_threshold = 0.75

[calibration]
# Per question, a temperature applied to the model's log-probabilities
# before they become probabilities (1 = as the model says; above 1 = less
# confident). Fit it with the shared evaluation suite (docs/eval-suite.md).
#unit.cause = 1.0

[translator]
# `basalt ask "..."`: requests in natural language translated by the local
# model into one basalt command. Off by default.
enabled = no
#endpoint = unix:/run/basalt-llm/llm.sock
#model =
# auto: compact for a fine-tuned translator (a model named
#   basalt-translator-*, the default of the local model service), examples
#   for any other model; the name is the configured model, or else the one
#   the endpoint serves (default).
# examples: instructions with examples, for a general model.
# compact: a short prompt, for a model fine-tuned for the translator.
#prompt = auto

[humanize]
# The assistant's text comes from fixed templates (the default). With
# enabled = yes, a model writes the explanation (what is wrong, why, what
# applying would do) in its own words, from the finding's facts only.
# Commands, risk, undo and the apply line always come from the template;
# a text that mentions any number, path, unit, type or command not in the
# facts, or is longer than max_chars, is dropped for the template's.
# `basalt apply` always shows the template. Off by default.
enabled = no
# Any OpenAI-compatible endpoint: the local model service (default), a
# bigger local server (llama.cpp, Ollama, vLLM on http://127.0.0.1:PORT/v1)
# or, only with allow_remote = yes, another machine or a hosted API.
#endpoint = unix:/run/basalt-llm/llm.sock
#model =
# Remote endpoints: secrets, tokens, keys, addresses and user names are
# redacted from the facts before they are sent, and the request is printed
# before it leaves the machine. The key file (root-only) is sent only there.
#allow_remote = no
#api_key_file = /etc/basalt/humanize.key
# auto: compact for a model fine-tuned for this (basalt-render-*), full
# instructions for any other model.
#prompt = auto
#max_chars = 600
#timeout = 30s
# Show accepted sentences as they arrive (on a terminal).
#stream = yes

[thresholds]
# Per question, overriding default_threshold:
#unit.cause = 0.75
#avc.class = 0.80
#dnf.next = 0.75
#disk.cause = 0.75
#event.notify = 0.60

[disk]
warn_pct = 85
crit_pct = 95
snapshots_large = 1G
journal_large = 512M
cache_large = 512M
journal_vacuum_to = 200M

[audit]
# The audit log (/var/log/basalt-assistant/audit.jsonl) is sealed and
# rotated by basalt-audit-rotate.timer (daily) once it reaches this size:
# the old file ends with a seal record (SHA-256 of its content) and is kept
# immutable as audit-<UTC time>.jsonl; the new file starts from that seal.
# `basalt audit verify` checks the chain across all files.
rotate_size = 32M

[notify]
# Findings always go to the journal (SYSLOG_IDENTIFIER=basalt-assistant;
# priority warning for the ones the decision layer marks for notification).
# basalt-notify adds:
# desktop: a desktop notification (freedesktop) to each local graphical
#   session. auto: only when the default target is graphical.target, so it
#   does nothing on a server; yes; no.
desktop = auto
# An HTTPS webhook (off while empty): a JSON POST per finding, signed with
# HMAC-SHA256 (headers X-Basalt-Timestamp and X-Basalt-Signature:
# sha256=HMAC(key, timestamp + "." + body)). The key file must be owned by
# root and not readable by others. Restart basalt-notify after a change.
#webhook_url = https://hooks.example.org/basalt
#webhook_secret_file = /etc/basalt/webhook.key
# notify: only findings marked for notification (default); all: every finding.
#webhook_events = notify
#webhook_timeout = 10s

[events]
# The same problem is reported once per window (repeats are counted).
dedup_window = 1h
# At most this many new proposals per hour.
max_proposals_per_hour = 20
disk_interval = 5m
dnf_min_age = 2m
dnf_settle = 15s
avc_settle = 5s
unit_settle = 3s
