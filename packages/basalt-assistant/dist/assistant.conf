# Basalt OS system assistant. Values shown are the defaults.
# Restart basalt-assistantd after a change.

[decision]
# rules: deterministic rules with fixed probabilities (the only backend
# implemented). openai-compatible: reserved for a local model server; it is
# not implemented yet and falls back to rules (the fallback is logged).
backend = rules
#endpoint = http://127.0.0.1:8080/v1
#model = basalt-decision
# Below this probability the assistant does not propose a change on its
# own; the finding is marked for review.
default_threshold = 0.75

[thresholds]
# Per question, overriding default_threshold:
#unit.cause = 0.75
#avc.class = 0.80
#dnf.next = 0.75
#disk.cause = 0.75
#event.notify = 0.60

[disk]
warn_pct = 85
crit_pct = 95
snapshots_large = 1G
journal_large = 512M
cache_large = 512M
journal_vacuum_to = 200M

[events]
# The same problem is reported once per window (repeats are counted).
dedup_window = 1h
# At most this many new proposals per hour.
max_proposals_per_hour = 20
disk_interval = 5m
dnf_min_age = 2m
dnf_settle = 15s
avc_settle = 5s
unit_settle = 3s
