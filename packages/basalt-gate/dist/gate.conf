# basalt-gate configuration (docs/gate.md). Defaults shown.

#socket = /run/basalt-gate/gate.sock
#state = /var/lib/basalt-gate
#registry = /usr/share/basalt/gate/actions.d
#presets = /usr/share/basalt/gate/presets
#hardlimits = /usr/share/basalt/gate/hardlimits.json
#ledger = /run/basalt-ledger/ledger.sock
#power_supply = /sys/class/power_supply

# The preset installed when there is no rule set yet: careful asks before
# every change.
#default_preset = careful

# Root's `basalt apply ID --yes --confirm CODE` stays a person's decision
# (used from phase 2, when the system assistant goes through the gate).
#allow_code_confirm = yes

# How long requests wait for a person: interactive ones, and those the
# requester marks deferrable (an unattended agent's request for the morning).
#interactive_expiry = 5m
#deferrable_expiry = 24h

# How long an approval may wait for its executor to claim it.
#claim_window = 10m

# Requests from agent domains carry at least this taint: allow rules match
# them only when they accept it (taint_max).
#agent_taint_floor = web

# Requests per minute per requester (bursts of half as many again).
#requests_per_minute = 30

# Who decides: SELinux types of the session surfaces (polkit for system,
# Critical and Cannot be undone decisions) and of the terminal decider
# (polkit for every decision).
#deciders = basalt_shell_ui_t basalt_app_approvals_t
#tty_deciders = basalt_gate_tty_t

# Trusted relays: SELinux types that may say on whose behalf they ask, and
# which requester kinds each may report.
#relays = basalt_shell_t:person,assistant,agent,app basalt_assistant_t:system-assistant,agent

# Agent domains (type prefixes): requesters only, never deciders.
#agent_types = basalt_agent container_ basalt_skill
