# Basalt OS snapshot settings (shell syntax).

# snapper configuration that holds the root file system snapshots.
SNAPPER_CONFIG=root

# How many snapshots the "Basalt OS snapshots" boot menu lists, newest first.
BOOT_MENU_LIMIT=8

# A system without snapshots yet (Basalt packages added to an installed
# Fedora): basalt-snapshots-auto.service sets them up at boot when the root
# is a btrfs subvolume booted by GRUB. off: never automatically (run
# basalt-snapshots-setup yourself).
SETUP=auto
