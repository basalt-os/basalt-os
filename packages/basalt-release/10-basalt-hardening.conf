# Basalt OS SSH baseline. sshd uses the first value it reads for each keyword,
# and this file sorts before the distribution defaults (50-*.conf), so these
# settings win. Override with a file that sorts earlier (e.g. 05-local.conf).

# Keys only: no passwords, no keyboard-interactive, no empty passwords.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# root may log in with a key only (installs inject root keys), never a password.
PermitRootLogin prohibit-password

# Reduce the surface of an interactive session.
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
PermitTunnel no
GatewayPorts no

# Limit unauthenticated work and drop dead peers.
LoginGraceTime 30
MaxAuthTries 3
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 2
