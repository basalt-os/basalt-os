# Release workflow: a skeleton, disabled by design.
#
# The OpenBasalt release key exists (docs/key-ceremony.md) and signs the
# published repositories on https://obpkg.org; that signing happens on the
# release signer, outside GitHub (scripts/release/sign.sh and the rest of
# scripts/release/). What is missing is the hand-off between this workflow
# and the release signer, so the gate job below fails on purpose and
# nothing else runs. This file documents where each step will happen, so
# that the pipeline is reviewed before it is enabled.
#
# Intended flow:
#   1. build      same scripts as CI (scripts/ci/build.sh), from a tag, on a
#                 GitHub-hosted runner; output: unsigned RPMs and SRPMs,
#                 checksums, a provenance attestation.
#   2. sign       NOT on GitHub. The release signer (a dedicated machine or
#                 a hardware token, see docs/key-ceremony.md "Routine use")
#                 fetches the unsigned build, checks the checksums and the
#                 attestation, signs the packages (rpmsign) and the
#                 repository metadata (repomd.xml.asc) with the repository
#                 signing subkey, and signs kernel modules with the module
#                 signing key. No private key is ever stored as a GitHub
#                 secret.
#   3. iso        the installer ISO is built from the signed repository
#                 (scripts/iso.sh build), and the live desktop ISO from the
#                 published, signed repositories (make
#                 release-live-desktop-iso: obpkg.org basalt and
#                 basalt-testing, mirrored and signature checked); checksums
#                 signed on the release signer.
#   4. publish    repository tree and ISOs uploaded to the release mirror;
#                 a GitHub release with checksums. This job will need
#                 `contents: write`, granted on that job only.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Release signer hand-off implemented?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Release signing is not set up yet
        run: |
          echo "::error title=Release disabled::The hand-off from this workflow to the release signer (docs/key-ceremony.md, scripts/release/) is not implemented. Releases stay disabled until it is; remove this gate in the same change that implements it."
          exit 1

  build:
    name: Build (unsigned, for the release signer)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PODMAN: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Build packages and the unsigned repository
        run: scripts/ci/build.sh rpms && scripts/ci/build.sh repo
      - name: Hand-off point to the release signer (not implemented)
        run: |
          echo "::error::Signing happens on the release signer, outside GitHub (docs/key-ceremony.md). Not implemented yet."
          exit 1

  live-desktop-iso:
    name: Live desktop ISO (from the published, signed repositories)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PODMAN: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Build the live desktop ISO (mirrors obpkg.org basalt and basalt-testing, checks their signatures)
        run: make release-live-desktop-iso
      - name: Hand-off point to the release signer (not implemented)
        run: |
          echo "::error::The ISO checksums are signed on the release signer, outside GitHub (docs/key-ceremony.md). Not implemented yet."
          exit 1
