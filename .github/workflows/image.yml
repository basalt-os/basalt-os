# Build the Basalt OS image on GitHub-hosted runners, push it to ghcr.io and
# sign it keyless with cosign (Sigstore: GitHub OIDC identity, Fulcio
# certificate, Rekor transparency log). No signing key is stored anywhere.
#
# Pull requests build only. Pushes to main and version tags publish
# <version> (from the VERSION file) and move the "stable" tag.
name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  CHANNEL_TAG: stable
  COSIGN_VERSION: v2.6.5

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing (OIDC token for Fulcio)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint scripts
        run: make lint

      - name: Free disk space for a bootc image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        env:
          # No key-based policy on the public image: keyless signatures cannot be
          # expressed in containers-policy.json for a workflow identity yet
          # (docs/signing.md). Verification uses cosign verify below.
          SIGNING_PUBKEY: ""
          PODMAN: sudo podman
          LAB_DIR: /nonexistent
        run: |
          echo "BASALT_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          REGISTRY="$REGISTRY" IMAGE_REPO="${IMAGE_REPO,,}" scripts/build.sh

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | sudo podman login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          image="$REGISTRY/${IMAGE_REPO,,}"
          sudo podman push --digestfile digest "$image:$BASALT_VERSION"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign (keyless) and move the channel tag
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | cosign login "$REGISTRY" -u "$ACTOR" --password-stdin
          cosign sign --yes "$IMAGE@$DIGEST"
          printf '%s' "$TOKEN" | skopeo login "$REGISTRY" -u "$ACTOR" --password-stdin
          skopeo copy --preserve-digests --all "docker://$IMAGE@$DIGEST" "docker://$IMAGE:$CHANNEL_TAG"

      - name: Verify the signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify "$IMAGE:$CHANNEL_TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/image\.yml@" \
            > /dev/null
          echo "signed: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
