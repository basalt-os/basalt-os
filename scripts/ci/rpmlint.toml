# rpmlint configuration for scripts/ci/lint.sh (spec files) and
# scripts/ci/build.sh (built packages). Each filter is a known, accepted
# finding; keep the reason next to it.
Filters = [
    # The en_US dictionary does not know dnf, subvolume, systemd, TPM and
    # similar technical words used in summaries and descriptions.
    'spelling-error',
    # libdnf5-plugin-actions is a dnf5 plugin, not a shared library.
    'explicit-lib-dependency libdnf5-plugin-actions',
    # basalt-desktop (basalt-shell 0.9) requires libfuse 2 for AppImages built
    # with the older runtime: they load it at run time, so rpm cannot find
    # the dependency by itself.
    'explicit-lib-dependency fuse-libs',
    # The SSH hardening drop-in is root-only on purpose, like sshd_config.
    'non-readable /etc/ssh/sshd_config.d/10-basalt-hardening.conf',
    # The assistant's audit log and state are root-only on purpose.
    'non-standard-dir-perm /var/log/basalt-assistant',
    'non-standard-dir-perm /var/lib/basalt-assistant',
    # The root command line's policy answers: root-only, never shared with the daemon.
    'non-standard-dir-perm /var/cache/basalt-assistant',
    # The approval gate's sealed rules, queue and state: root-only on purpose.
    'non-standard-dir-perm /var/lib/basalt-gate',
    # basalt-shell's UI launcher is a PIE with an interpreter but no shared
    # library (it uses only the Go runtime and syscalls), which rpmlint reads
    # as static.
    'statically-linked-binary /usr/libexec/basalt-shell/basalt-shell-ui-launch',
    # basalt-vm-cursor (basalt-shell 0.5.1) is built the same way: Go runtime
    # and the DRM cursor ioctl through syscall, no shared library.
    'statically-linked-binary /usr/libexec/basalt-shell/basalt-vm-cursor',
]
