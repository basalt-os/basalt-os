# The official Go toolchain the Go packages are built with: basalt-installer,
# basalt-agent, basalt-assistant, and basalt-shell (built here from its own
# repository). Fedora's golang can lag behind Go's security releases, so
# these builds use the official release from go.dev, checked against the
# SHA-256 pinned here (scripts/lib.sh, go_toolchain); nothing else about
# the download is trusted. To move to a new Go release, change both lines
# (the checksum from https://go.dev/dl/) and the go line of each go.mod
# that names this version.
# shellcheck shell=bash disable=SC2034
GO_VERSION=1.27.4
GO_SHA256=7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
